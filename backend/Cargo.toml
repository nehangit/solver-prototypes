[package]
name = "solverevlos"
version = "0.1.0"
edition = "2021"


[dependencies]
actix-web = "4"
actix-cors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
solvers-dto = { git = "https://github.com/nehangit/services", subdir = "crates/solvers-dto" }
solvers = { git = "https://github.com/nehangit/services", subdir = "crates/solvers" }
chrono = "0.4.38"
primitive-types = "0.12"
web3 = "0.19.0"
serde_with = "3.11.0"
reqwest = { version = "^0.11", features = ["json", "default-tls"] }
thiserror = "1.0"
number = "0.0.1"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "full"] }
bigdecimal = { version = "0.3.1", features = ["serde"] }
anyhow = "1"
hex = "0.4.3"
